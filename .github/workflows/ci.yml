name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chatbot:testpass@127.0.0.1:5432/chatbot_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Test-Admin-123456
      SECRET_KEY: ci-only-secret-key-not-for-production
      ENVIRONMENT: test
      ALLOW_BOOTSTRAP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff (fatal errors only)
        working-directory: backend
        run: ruff check app tests
      - name: Pytest (unit + PostgreSQL/Redis integration)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
