# 生产 HTTPS 配置：配合 Cloudflare Full (strict) 使用
# 将 Cloudflare Origin Certificate 放到 ./certs/origin.pem 与 ./certs/origin.key，
# 再执行：docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# 80 端口保留用于容器健康检查和边缘探活；本配置不内置 ACME webroot，
# 如需 HTTP-01 请另外挂载 /.well-known/acme-challenge/。

server {
    listen 80;
    include /etc/nginx/snippets/server-common.conf;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/server-common.conf;
}
