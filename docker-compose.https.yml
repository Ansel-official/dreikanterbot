# HTTPS 覆盖配置：启用 Cloudflare Origin Certificate（Full strict）
#
# 前置：
#   1. Cloudflare 控制台生成 Origin Certificate，保存为 certs/origin.pem / certs/origin.key
#   2. 启动时显式叠加本文件：
#      docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#   3. 或在 certs/ 下准备好证书后直接运行 ./deploy.sh（会自动检测并叠加）
services:
  frontend:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
